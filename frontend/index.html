<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyHub · Material de estudio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23166b4a'/><path d='M8 11l8-4 8 4-8 4z M11 13v5c0 2 10 2 10 0v-5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Pantalla de autenticación -->
  <section id="vista-auth" class="auth" hidden>
    <div class="auth__panel">
      <div class="marca marca--grande">
        <span class="marca__logo" aria-hidden="true"></span>
        <span>StudyHub</span>
      </div>
      <p class="auth__lema">Material de estudio y PQRS de tus cursos, en un solo lugar.</p>

      <div class="pestanas" role="tablist">
        <button class="pestana activa" data-pestana="login" role="tab">Iniciar sesión</button>
        <button class="pestana" data-pestana="registro" role="tab">Crear cuenta</button>
      </div>

      <form id="form-login" class="formulario" data-panel="login">
        <label>Correo
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>Contraseña
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="boton boton--primario" type="submit">Entrar</button>
      </form>

      <form id="form-registro" class="formulario" data-panel="registro" hidden>
        <label>Nombre completo
          <input name="nombre" type="text" autocomplete="name" minlength="3" required />
        </label>
        <label>Correo
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>Contraseña
          <input name="password" type="password" autocomplete="new-password" minlength="8" required />
          <small>Mínimo 8 caracteres, con mayúsculas, minúsculas y números.</small>
        </label>
        <button class="boton boton--primario" type="submit">Crear cuenta</button>
      </form>

      <form id="form-confirmar" class="formulario" data-panel="confirmar" hidden>
        <p class="nota">Te enviamos un código a <strong id="confirmar-email"></strong>. Escríbelo para activar tu cuenta.</p>
        <input name="email" type="hidden" />
        <label>Código de verificación
          <input name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" required />
        </label>
        <button class="boton boton--primario" type="submit">Confirmar cuenta</button>
        <button class="boton boton--enlace" type="button" id="reenviar-codigo">Reenviar código</button>
      </form>
    </div>
    <aside class="auth__lado" aria-hidden="true">
      <div class="auth__tarjeta">
        <span class="etiqueta etiqueta--verde">Serverless en AWS</span>
        <p>S3 · Cognito · API Gateway · Lambda · DynamoDB · CloudWatch</p>
      </div>
    </aside>
  </section>

  <!-- Aplicación -->
  <div id="vista-app" hidden>
    <header class="barra">
      <a class="marca" href="#/cursos">
        <span class="marca__logo" aria-hidden="true"></span>
        <span>StudyHub</span>
      </a>
      <nav class="menu">
        <a href="#/cursos" data-ruta="cursos">Cursos</a>
        <a href="#/pqrs" data-ruta="pqrs">PQRS</a>
      </nav>
      <div class="perfil">
        <div class="perfil__datos">
          <span id="perfil-nombre"></span>
          <span id="perfil-rol" class="etiqueta"></span>
        </div>
        <button id="cerrar-sesion" class="boton boton--secundario boton--chico">Salir</button>
      </div>
    </header>
    <main id="contenido" class="contenido"></main>
  </div>

  <div id="avisos" class="avisos" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
